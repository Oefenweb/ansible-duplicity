# tasks file
---
- name: install | ppa | install dependencies (pre)
  ansible.builtin.apt:
    name: "{{ duplicity_ppa_dependencies_pre }}"
    state: "{{ apt_install_state | default('latest') }}"
    update_cache: true
    cache_valid_time: "{{ apt_update_cache_valid_time | default(3600) }}"
  tags:
    - duplicity-install-ppa-install-dependencies

- name: install | ppa | (keyrings) directory | create
  ansible.builtin.file:
    path: "{{ duplicity_ppa_keyring_dst | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - duplicity-install-ppa-keyrings-directory-create

- name: install | ppa | (keyring) file | download
  ansible.builtin.apt_key:
    id: "{{ duplicity_ppa_keyring_id }}"
    keyserver: "{{ apt_key_keyserver | default('keyserver.ubuntu.com') }}"
    keyring: "{{ duplicity_ppa_keyring_dst }}"
    state: present
  tags:
    - duplicity-install-ppa-keyring-file-download

- name: install | ppa | cleanup
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items: "{{ duplicity_ppa_repository_files_absent }}"
  tags:
    - duplicity-install-ppa-cleanup

- name: install | ppa | add
  ansible.builtin.apt_repository:
    repo: "{{ item.type }} {{ item.url }} {{ item.component }}"
    state: "{{ item.state | default('present') }}"
    update_cache: true
    mode: '0644'
  with_items: "{{ duplicity_ppa_repositories }}"
  tags:
    - duplicity-install-ppa-add
