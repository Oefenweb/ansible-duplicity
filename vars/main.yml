# vars file
---
duplicity_package_name: duplicity
duplicity_native_dependencies:
  - "{{ duplicity_package_name }}"

duplicity_ppa_stable: 'duplicity-team/duplicity-release-git'
# duplicity_ppa_daily: 'duplicity-team/duplicity-develop-git'

duplicity_ppa_dependencies_pre:
  - software-properties-common
  - dirmngr
  - apt-transport-https
duplicity_ppa_dependencies: "{{ duplicity_native_dependencies }}"

duplicity_ppa_keyring_id: 4BC056F4C31D7D82488C3AA9EA0A88258CB19A4A
duplicity_ppa_keyring_dst: /usr/share/keyrings/duplicity.gpg
duplicity_ppa_repositories:
  - type: "deb [signed-by={{ duplicity_ppa_keyring_dst }}]"
    url: "https://ppa.launchpadcontent.net/{{ duplicity_ppa_stable }}/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }}"
    component: main
duplicity_ppa_repository_files_absent:
  - "/etc/apt/sources.list.d/ppa_duplicity_team_duplicity_release_git_{{ ansible_facts['distribution_release'] }}.list"
  - "/etc/apt/sources.list.d/ppa_duplicity_team_duplicity_release_git_{{ ansible_facts['distribution_release'] }}.list.save"
  - "/etc/apt/sources.list.d/ppa_duplicity_team_duplicity_develop_git_{{ ansible_facts['distribution_release'] }}.list"
  - "/etc/apt/sources.list.d/ppa_duplicity_team_duplicity_develop_git_{{ ansible_facts['distribution_release'] }}.list.save"

duplicity_pip_dependencies_pre:
  - build-essential
  - librsync-dev
  - rdiff
  - gettext
duplicity_pip_dependencies_pre_python:
  - setuptools_scm
duplicity_pip_pip_executable: "pip{{ (ansible_facts['distribution_version'] is version('20.04', '>=')) | ternary('3', '2') }}"

duplicity_pip_duplicity_path: /usr/local/bin/duplicity
